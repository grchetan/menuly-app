<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="menuly-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#0d4722" />
    </linearGradient>
  </defs>

  <!-- Squircle rounded badge -->
  <rect x="8" y="8" width="496" height="496" rx="110" ry="110" fill="url(#menuly-bg)" stroke="#22c55e" stroke-width="5" stroke-opacity="0.4" />

  <!-- QR Finder Eyes (White) -->
  <g fill="#ffffff">
    <!-- Top-Left Finder Eye -->
    <rect x="96" y="96" width="104" height="104" rx="24" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="126" y="126" width="44" height="44" rx="10" />

    <!-- Top-Right Finder Eye -->
    <rect x="312" y="96" width="104" height="104" rx="24" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="342" y="126" width="44" height="44" rx="10" />

    <!-- Bottom-Left Finder Eye -->
    <rect x="96" y="312" width="104" height="104" rx="24" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="126" y="342" width="44" height="44" rx="10" />

    <!-- Center Cross & Timing Tracks -->
    <rect x="236" y="107" width="40" height="40" rx="9" />
    <rect x="236" y="172" width="40" height="40" rx="9" />
    <rect x="236" y="236" width="40" height="40" rx="9" />
    <rect x="236" y="300" width="40" height="40" rx="9" />
    <rect x="236" y="365" width="40" height="40" rx="9" />

    <rect x="107" y="236" width="40" height="40" rx="9" />
    <rect x="172" y="236" width="40" height="40" rx="9" />
    <rect x="300" y="236" width="40" height="40" rx="9" />
    <rect x="365" y="236" width="40" height="40" rx="9" />

    <!-- Bottom-Right Data Cluster -->
    <rect x="315" y="315" width="40" height="40" rx="9" />
    <rect x="365" y="315" width="40" height="40" rx="9" />
    <rect x="340" y="340" width="40" height="40" rx="9" />
    <rect x="315" y="365" width="40" height="40" rx="9" />
    <rect x="365" y="365" width="40" height="40" rx="9" />
  </g>
</svg>